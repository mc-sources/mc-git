# Mc-Git — Release pipeline
#
# Triggered when a `v*.*.*` tag is pushed (or via manual `workflow_dispatch`).
# Builds the desktop app on Ubuntu, macOS and Windows, then publishes a
# GitHub Release with all bundle artifacts attached.
#
# Steps:
#   1. extract-changelog (Ubuntu)         - parse CHANGELOG.md for the
#                                           current version section, expose
#                                           it as the release body
#   2. build (matrix: 3 OS)               - Tauri build via `tauri-action`,
#                                           which also creates the GitHub
#                                           Release on the first job and
#                                           uploads bundles from the others
#
# Required permissions:
#   - contents: write   (to create the release and upload artifacts)
#
# Bundles produced (matches docs/release.md):
#   - Linux   : mcgit_X.Y.Z_amd64.deb, mcgit_X.Y.Z_amd64.AppImage
#   - macOS   : mcgit_X.Y.Z_aarch64.dmg (default runner is Apple Silicon)
#   - Windows : mcgit_X.Y.Z_x64_en-US.msi, mcgit_X.Y.Z_x64-setup.exe
#
# Code signing is intentionally out of scope for the 0.x cycle (see
# docs/release.md). Users will see "unidentified developer" warnings on
# macOS and Windows SmartScreen prompts on first launch; both are bypassable.
#
# Security note: this workflow does not consume untrusted user input
# (issue titles, PR bodies, commit messages) in any `run:` step. The only
# externally-controlled input is `inputs.tag` (workflow_dispatch only,
# manual mainteneur action) and `github.ref_name` (validated tag name on
# push). Both are passed only as `ref` to `actions/checkout` and as named
# inputs to `tauri-apps/tauri-action`, never spliced into shell commands.

name: release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v0.1.4)'
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  extract-changelog:
    name: Extract release notes from CHANGELOG
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.extract.outputs.body }}
      version: ${{ steps.extract.outputs.version }}
      tag: ${{ steps.extract.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Extract section for current version
        id: extract
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const ref = context.payload.inputs?.tag || context.ref.replace('refs/tags/', '');
            const version = ref.replace(/^v/, '');
            const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
            const escaped = version.replace(/\./g, '\\.');
            const re = new RegExp(
              `## \\[${escaped}\\][^\\n]*\\n([\\s\\S]*?)(?=\\n## \\[|\\n---\\s*$|$)`
            );
            const match = changelog.match(re);
            const body = match
              ? match[1].trim()
              : 'See CHANGELOG.md for release notes.';
            core.setOutput('tag', ref);
            core.setOutput('version', version);
            core.setOutput('body', body);

  build:
    name: Build (${{ matrix.platform }})
    needs: extract-changelog
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.extract-changelog.outputs.tag }}

      - name: Install Tauri system dependencies (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libssl-dev \
            pkg-config

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-${{ matrix.platform }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm deps
        run: npm ci

      - name: Build app and publish to GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.extract-changelog.outputs.tag }}
          releaseName: 'Mc-Git ${{ needs.extract-changelog.outputs.version }}'
          releaseBody: ${{ needs.extract-changelog.outputs.body }}
          releaseDraft: false
          prerelease: false

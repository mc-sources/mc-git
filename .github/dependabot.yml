# Mc-Git — Dependabot configuration
# Documentation: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Rust backend — Cargo.toml in src-tauri/
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      tauri-stack:
        patterns:
          - "tauri*"
          - "tauri-*"
      git2-stack:
        patterns:
          - "git2"
          - "libgit2-sys"
      patch-updates:
        update-types:
          - "patch"

  # Frontend — package.json at repo root
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      react-stack:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"
      tauri-js:
        patterns:
          - "@tauri-apps/*"
      vite-stack:
        patterns:
          - "vite"
          - "@vitejs/*"
      tailwind-stack:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
      patch-updates:
        update-types:
          - "patch"

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"

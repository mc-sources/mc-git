<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Mc-Git — picto-mark</title>
  <desc>Pictogramme M-graphe : 3 noeuds de commit reliés dessinant un M. Direction 2 (Refresh ADN), validée ANA-0005 / T-0002.</desc>

  <rect width="512" height="512" rx="96" ry="96" fill="#2A2A2A"/>

  <path
    d="M 160 416 L 160 128 L 256 320 L 352 128 L 352 416"
    stroke="#D2691E"
    stroke-width="36"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <g fill="#D2691E" stroke="#2A2A2A" stroke-width="6">
    <circle cx="160" cy="128" r="40"/>
    <circle cx="256" cy="320" r="40"/>
    <circle cx="352" cy="128" r="40"/>
  </g>
</svg>

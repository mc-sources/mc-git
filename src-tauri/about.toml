# about.toml — Config cargo-about pour Mc-Git
#
# Liste des licences acceptées pour la génération du fichier d'attribution
# THIRD-PARTY-NOTICES-rust.md.
#
# Cette liste est alignée sur `deny.toml` (mêmes licences, même justification
# de compatibilité avec GPL-3.0-only).

accepted = [
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "Unicode-3.0",
    "GPL-3.0-only",
]

# Dépendances de build et de test ne sont pas distribuées dans le binaire Mc-Git :
# seul ce qui est embarqué au runtime a des obligations d'attribution au sens
# GPL-3.0-only.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# Crates privées (workspaces internes) — aucune pour Mc-Git aujourd'hui.
ignore-transitive-dependencies = false
